apiVersion: v1
kind: Namespace
metadata: { name: superintelligence }
---
apiVersion: apps/v1
kind: Deployment
metadata: { name: si-app, namespace: superintelligence }
spec:
  replicas: 2
  selector: { matchLabels: { app: si-app } }
  template:
    metadata: { labels: { app: si-app } }
    spec:
      containers:
        - name: si-app
          image: pipeline-to-cluster:5
          imagePullPolicy: IfNotPresent
          ports: [{ containerPort: 3000 }]
          envFrom: [{ secretRef: { name: si-secrets } }]
          readinessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 3000 }
            initialDelaySeconds: 15
          resources:
            requests: { cpu: 100m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
---
apiVersion: v1
kind: Service
metadata: { name: si-app, namespace: superintelligence }
spec:
  type: LoadBalancer
  selector: { app: si-app }
  ports: [{ port: 80, targetPort: 3000 }]
